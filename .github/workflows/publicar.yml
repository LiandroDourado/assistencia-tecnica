# Publica a imagem no GitHub Container Registry.
# Dispara ao criar uma versão (Releases → tag v1.0.0, v1.0.1...) ou manualmente
# pela aba Actions. Os testes rodam dentro do Dockerfile: se falharem, nada é publicado.
name: Publicar imagem

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Seção 6.1: dependências Go conferidas contra vulnerabilidades conhecidas.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verificar vulnerabilidades (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Definir versão
        id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "valor=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "valor=teste-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: VERSAO=${{ steps.versao.outputs.valor }}
          tags: ghcr.io/liandrodourado/assistencia-tecnica:${{ steps.versao.outputs.valor }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Assistência Técnica
            org.opencontainers.image.version=${{ steps.versao.outputs.valor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
